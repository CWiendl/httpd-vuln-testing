name: CodeQL

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze Apache httpd 2.4.49 (C/C++)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      # You can still checkout your repo so results attach to it
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp
          queries: +security-extended

      - name: Install build prerequisites (use system APR/APU)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf libtool libtool-bin pkg-config \
            libapr1-dev libaprutil1-dev \
            libexpat1-dev libpcre3-dev curl perl

      - name: Fetch httpd 2.4.49 release tarball
        run: |
          curl -fsSLO https://archive.apache.org/dist/httpd/httpd-2.4.49.tar.gz
          tar xzf httpd-2.4.49.tar.gz

      - name: Configure & build httpd (no buildconf; system APR/APU)
        env:
          MAKEFLAGS: -j2
        working-directory: httpd-2.4.49
        run: |
          ./configure \
            --with-apr=/usr/bin/apr-1-config \
            --with-apr-util=/usr/bin/apu-1-config
          make

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:cpp"
          output: codeql-results

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: codeql-results
