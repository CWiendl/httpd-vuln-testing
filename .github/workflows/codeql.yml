name: CodeQL

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze Apache httpd 2.4.49 (C/C++)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      # Get upstream source at the vulnerable tag
      - name: Checkout Apache httpd 2.4.49
        uses: actions/checkout@v4
        with:
          repository: apache/httpd
          ref: 2.4.49
          fetch-depth: 1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp
          queries: +security-extended

      # Use system APR/APU instead of bundling srclib/apr*
      - name: Install build prerequisites (system APR/APU)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf libtool libtool-bin pkg-config \
            libapr1-dev libaprutil1-dev \
            libexpat1-dev libpcre3-dev curl perl

      - name: Build httpd (link against system APR/APU)
        env:
          MAKEFLAGS: -j2
        run: |
          ./buildconf
          ./configure \
            --with-apr=/usr/bin/apr-1-config \
            --with-apr-util=/usr/bin/apu-1-config
          make

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:cpp"
          output: codeql-results

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: codeql-results
